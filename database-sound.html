<script>
(function(){
  var here = location.pathname.split('/').pop() || 'index.html';
  var payload = JSON.parse(document.getElementById('yh-payload').textContent);
  var form = document.getElementById('gateForm'), input = document.getElementById('gateInput');
  var error = document.getElementById('gateError'), note = document.getElementById('gateNote');
  var after = parseInt(document.getElementById('gate').getAttribute('data-after') || '2', 10);
  var fails = 0, busy = false;
  function open(html){ document.open(); document.write(html); document.close(); }
  async function attempt(code, silent){
    if(busy || !code) return;
    busy = true;
    try{
      var html = await YHAccess.decrypt(payload, code);
      YHAccess.remember(here, code);
      open(html);
    }catch(e){
      if(!silent){
        fails++; error.classList.add('show'); input.value = '';
        if(note && fails >= after) note.classList.add('show');
      }
    }
    busy = false;
  }
  var saved = YHAccess.recall(here);
  if(saved) attempt(saved, true);
  form.addEventListener('submit', function(e){ e.preventDefault(); attempt(input.value.trim()); });
  input.addEventListener('input', function(){ if(input.value.length === 4) attempt(input.value.trim()); });
  setTimeout(function(){ input.focus(); }, 60);
})();
</script>
